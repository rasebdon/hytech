<div class="page-overlay" style="layout-mode: Middle;">
    <div class="container" data-hyui-title="{{$blockName}} - Sides" id="base-container"
         style="anchor-height: 400; anchor-width: 420;">
        <div class="container-contents" style="layout-mode: Middle;">

            <p id="side-config-hint" style="margin-top: 4; text-align: center;">
                Click a side to cycle Both / In / Out / Off</p>

            <!-- One row per resource the block carries; rows for absent resources are never
                 added, so a plain battery shows only Energy. -->
            <div id="side-config-rows" style="layout-mode: Vertical; margin-top: 8;"></div>

            <button id="side-config-back" style="margin-top: 12; anchor-height: 25; anchor-width: 150">
                Back
            </button>
        </div>
    </div>
</div>
