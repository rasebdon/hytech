<div class="page-overlay" style="layout-mode: Middle;">
    <div class="container" data-hyui-title="{{$blockName}}" id="base-container"
         style="anchor-height: 260; anchor-width: 340;">
        <div class="container-contents" style="layout-mode: Middle;">

            <!-- Fixed rows, hidden when the block has fewer containers. Everything here is
                 declared statically and only ever relabelled: elements added at runtime are not
                 registered for events, and a nested div carrying its own layout-mode was what
                 disconnected the client. -->
            <p id="container-row-0" style="margin-top: 10; text-align: center;">-</p>
            <p id="container-row-1" style="margin-top: 6; text-align: center;">-</p>
            <p id="container-row-2" style="margin-top: 6; text-align: center;">-</p>

            <button id="side-config-button" style="margin-top: 12; anchor-height: 25; anchor-width: 150">Configure Sides</button>
            <button id="exit-button" style="margin-top: 8; anchor-height: 25; anchor-width: 150">Exit</button>
        </div>
    </div>
</div>
