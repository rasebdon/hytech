<div class="page-overlay" style="layout-mode: Middle;">
    <div class="container" data-hyui-title="{{$blockName}}" id="base-container"
         style="anchor-height: 380; anchor-width: 320;">
        <div class="container-contents" style="layout-mode: Middle;">

            <p id="fuel-label" style="margin-top: 6; text-align: center;">Fuel</p>

            <!-- Draggable so a player can drop fuel straight in. The grid only renders and
                 reports; the server performs the actual move in the Dropped handler. -->
            <div class="item-grid" data-hyui-are-items-draggable="true"
                 data-hyui-display-item-quantity="true" data-hyui-slots-per-row="4"
                 id="fuel-grid" style="anchor-width: 200; anchor-height: 96; margin-vertical: 4"></div>

            <p id="burn-label" style="color: {{$burnColor}}; margin-top: 8; text-align: center;">
                {{$burnStatus}}</p>
            <progress id="burn-bar" max="1" style="anchor-width: 200; anchor-height: 10; margin-vertical: 4"
                      value="{{$burnRatio}}"></progress>

            <progress id="energy-bar" max="1" style="anchor-width: 200; anchor-height: 15; margin-vertical: 8"
                      value="{{$energyFillRatio}}"></progress>
            <p id="energy-label" style="margin-top: 4; text-align: center;">
                {{$currentEnergy|number}}/{{$maxEnergy|number}} RF</p>
            <p id="energy-change-label" style="color: {{$rateColor}}; margin-top: 4; text-align: center;">
                {{$ratePrefix}}{{$currentRate|number}} RF/t (Max {{$maxRate|number}} RF/t)</p>
            <button id="side-config-button" style="margin-top: 8; anchor-height: 25; anchor-width: 150">Configure Sides</button>

            <button id="exit-button" style="margin-top: 12; anchor-height: 25; anchor-width: 150">Exit</button>
        </div>
    </div>
</div>
