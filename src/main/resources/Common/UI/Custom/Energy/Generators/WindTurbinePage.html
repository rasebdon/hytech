<div class="page-overlay" style="layout-mode: Middle;">
    <div class="container" data-hyui-title="{{$blockName}}" id="base-container"
         style="anchor-height: 280; anchor-width: 300;">
        <div class="container-contents" style="layout-mode: Middle;">

            <p id="output-label" style="color: {{$rateColor}}; margin-top: 10; text-align: center;">
                {{$ratePrefix}}{{$currentRate|number}} RF/t (Max {{$maxRate|number}} RF/t)</p>

            <p id="altitude-label" style="margin-top: 6; text-align: center;">
                Altitude: Y {{$altitude}}</p>
            <progress id="altitude-bar" max="1" style="anchor-width: 200; anchor-height: 10; margin-vertical: 4"
                      value="{{$altitudeFactor}}"></progress>

            <progress id="energy-bar" max="1" style="anchor-width: 200; anchor-height: 15; margin-vertical: 10"
                      value="{{$energyFillRatio}}"></progress>
            <p id="energy-label" style="margin-top: 4; text-align: center;">
                {{$currentEnergy|number}}/{{$maxEnergy|number}} RF</p>
            <button id="side-config-button" style="margin-top: 8; anchor-height: 25; anchor-width: 150">Configure Sides</button>

            <button id="exit-button" style="margin-top: 16; anchor-height: 25; anchor-width: 150">Exit</button>
        </div>
    </div>
</div>
